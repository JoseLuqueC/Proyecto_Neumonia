[project]
name = "neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JoseLuqueC", email = "joseluque93l.lc@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "pydicom>=3.0.2",
    "pytest>=9.1.1",
    "streamlit>=1.62.0",
    "tensorflow>=2.21.0",
    "tkcap>=0.0.4",
]

[project.scripts]
neumonia = "neumonia:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
